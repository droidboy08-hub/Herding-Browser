[package]
name = "adblock_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# `single-thread` is in the crate's default feature set and swaps `Arc` for `Rc`,
# which would make the engine unsound to hand between threads even under a Swift
# actor. Everything else we need is opt-in:
#   content-blocking       — the WKContentRuleList JSON converter
#   embedded-domain-resolver — eTLD+1 parsing without a host-supplied resolver
#   full-regex-handling    — the regex filters the simplified matcher can't express
adblock = { version = "0.13.2", default-features = false, features = [
    "content-blocking",
    "embedded-domain-resolver",
    "full-regex-handling",
] }
serde_json = "1"

[lib]
name = "adblock_ffi"
# `staticlib` is what the xcframework ships; `rlib` exists so the tests below can
# link against the crate and exercise the FFI on the host.
crate-type = ["staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Deliberately NOT `panic = "abort"`: every entry point below wraps its body in
# `catch_unwind`, so a malformed filter list degrades to "no rules" instead of
# taking the browser down with it.
